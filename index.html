<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jai Kumar | Profile Card</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Main Container -->
    <main class="container">

        <!-- Profile Card -->
        <div class="profile-card">

            <!-- Profile Image -->
            <div class="profile-image">

                <img src="images/profile-pic.jpeg"
                    alt="Jai Kumar Profile Photo">

            </div>

            <!-- Personal Information -->
            <h1>Jai Kumar</h1>

            <h3>Computer Science Engineering Student</h3>

            <!-- Bio -->
            <p class="bio">
                Hello! I am a Computer Science Engineering student
                specializing in Artificial Intelligence and Machine Learning.
                I love coding, building projects and learning new technologies.
            </p>

            <!-- Skills -->
            <div class="skills">

                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>C++</span>

            </div>

            <!-- Social Links -->
            <div class="social-links">

                <a href="https://github.com/" target="_blank">
                    <i class="fa-brands fa-github"></i>
                    GitHub
                </a>

                <a href="https://linkedin.com/" target="_blank">
                    <i class="fa-brands fa-linkedin"></i>
                    LinkedIn
                </a>

            </div>

            <!-- Contact Button -->
            <a href="mailto:your-email@example.com" class="contact-btn">

                <i class="fa-solid fa-envelope"></i>
                Contact Me

            </a>

        </div>

    </main>

</body>

</html>
